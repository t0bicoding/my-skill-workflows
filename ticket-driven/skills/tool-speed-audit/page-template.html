<style>
/* Tool speed report: one reading column; head → where the time goes (stacked per session) →
   slowest command groups (bars) → slowest single calls → findings → proposals → method.
   Filled by `node tool-timing.mjs render <dir>`; all content comes from the embedded JSON. */
:root {

  --muted: #545a64;
  --faint: #7d828a;
  --line: #dde1e6;
  --grid: #e1e0d9;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --s4: #eda100;
  --s5: #e87ba4;
  --accent: #2a78d6;
  --accent-soft: #e3edfa;
  --crit: #d03b3b;
  --warn: #c98500;
  --tint-crit: #fbe7e6;
  --tint-warn: #fbf1dc;
  --tint-low: #eceef1;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101216; --surface: #1a1a19; --ink: #f0efec; --muted: #c3c2b7; --faint: #8f949b; --line: #2c3036; --grid: #2c2c2a;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    --accent: #7eaaf0; --accent-soft: #1b2a40; --crit: #ff8a7a; --warn: #f0b54a;
    --tint-crit: #3a1d1a; --tint-warn: #2e2512; --tint-low: #23262b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101216; --surface: #1a1a19; --ink: #f0efec; --muted: #c3c2b7; --faint: #8f949b; --line: #2c3036; --grid: #2c2c2a;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  --accent: #7eaaf0; --accent-soft: #1b2a40; --crit: #ff8a7a; --warn: #f0b54a;
  --tint-crit: #3a1d1a; --tint-warn: #2e2512; --tint-low: #23262b;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; }
.page { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 40px 64px; display: grid; gap: 48px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.9rem, 5.5vw, 2.6rem); line-height: 1.1; letter-spacing: -0.01em; }
h2 { font-size: 1.3rem; line-height: 1.2; }
h3 { font-size: 1.02rem; line-height: 1.3; }
p { margin: 0; }
section { display: grid; gap: 16px; min-width: 0; }
.mono { font-family: var(--f-mono); font-size: .82em; }
.note { color: var(--muted); font-size: .9rem; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.hero { display: grid; gap: 14px; }
.eyebrow { font-size: .76rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 700; }
.lead { font-size: 1.15rem; max-width: 38em; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 20px; color: var(--muted); font-size: .9rem; }
.facts b { color: var(--ink); font-variant-numeric: tabular-nums; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 2px; }
.tile-value { font-family: var(--f-display); font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile-label { color: var(--muted); font-size: .85rem; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .85rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

.stack-row { display: grid; grid-template-columns: 7.5rem 1fr; gap: 12px; align-items: center; }
.stack-label { font-family: var(--f-mono); font-size: .75rem; color: var(--muted); }
.stack-track { display: flex; gap: 2px; min-width: 0; }
.stack-seg { height: 16px; min-width: 2px; }
.stack-seg:first-child { border-radius: 4px 0 0 4px; }
.stack-seg:last-child { border-radius: 0 4px 4px 0; }
.stack-seg:only-child { border-radius: 4px; }

.hbars { display: grid; gap: 10px; }
.hbar-row { display: grid; grid-template-columns: minmax(7rem, 15rem) 1fr minmax(9rem, auto); gap: 12px; align-items: center; }
.hbar-label { font-family: var(--f-mono); font-size: .78rem; overflow-wrap: anywhere; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; min-width: 0; }
.hbar-track { min-width: 0; border-left: 1px solid var(--grid); }
.hbar-fill { height: 14px; border-radius: 0 4px 4px 0; }
.hbar-val { font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }

.chip { display: inline-flex; align-items: center; gap: 5px; font-family: var(--f-body); font-size: .74rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.chip.high { background: var(--tint-crit); color: var(--crit); }
.chip.medium { background: var(--tint-warn); color: var(--warn); }
.chip.low { background: var(--tint-low); color: var(--muted); }
.chip.plain { background: var(--accent-soft); color: var(--accent); }
.chip.err { background: var(--tint-crit); color: var(--crit); }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .86rem; }
th { text-align: left; font-weight: 700; color: var(--muted); font-size: .76rem; text-transform: uppercase; letter-spacing: .05em; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); }
td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.cmd { font-family: var(--f-mono); font-size: .76rem; overflow-wrap: anywhere; min-width: 16rem; }
details summary { cursor: pointer; color: var(--muted); font-size: .88rem; }

.cards { display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 8px; min-width: 0; }
.card-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; }
.card-id { font-family: var(--f-mono); font-size: .85rem; color: var(--accent); font-weight: 500; }
.card dl { display: grid; grid-template-columns: 7.5rem 1fr; gap: 4px 12px; margin: 0; font-size: .92rem; }
.card dt { color: var(--muted); }
.card dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.reply { border: 1px dashed var(--accent); border-radius: 12px; padding: 14px 18px; background: var(--accent-soft); display: grid; gap: 6px; }
.reply code { font-family: var(--f-mono); font-size: .85rem; }

.tip { position: fixed; z-index: 20; max-width: 320px; background: var(--ink); color: var(--bg); font-size: .8rem; padding: 6px 9px; border-radius: 6px; pointer-events: none; white-space: pre-line; }
[data-tip] { cursor: default; }

@media (max-width: 640px) {
  .hbar-row { grid-template-columns: 1fr auto; }
  .hbar-label { grid-column: 1 / -1; }
  .stack-row { grid-template-columns: 1fr; gap: 4px; }
  .card dl { grid-template-columns: 1fr; }
  .card dt { margin-top: 4px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
(function () {
  const { data, findings } = JSON.parse(document.getElementById('report-data').textContent);
  const F = findings || {};
  const de = String(F.lang || 'en').toLowerCase().startsWith('de');
  const L = de ? {
    eyebrow: 'Tool-Tempo', sessions: 'Sitzungen', calls: 'Tool-Calls', period: 'Zeitraum', made: 'erstellt',
    tileTools: 'Maschinenzeit in Tools', tileErrors: 'Fehlgeschlagene Calls', tilePrompts: 'Freigabe-Abfragen', tileSleep: 'Schlafen / Warten',
    splitH: 'Wohin die Zeit geht', splitNote: 'Pro Sitzung, Hauptunterhaltung. Länge maßstäblich zur längsten Sitzung.',
    tools: 'Tools', approval: 'Warten auf Freigabe', human: 'Warten auf deine Antwort', model: 'Modell denkt und schreibt', subagents: 'Subagents',
    table: 'Als Tabelle', groupsH: 'Langsamste Befehlsgruppen', groupsNote: 'Summe der Wanduhrzeit je Befehl, Hauptunterhaltung und Subagents.',
    median: 'Median', errors: 'Fehler', slowH: 'Langsamste Einzel-Calls', when: 'Sitzung', what: 'Aufruf', time: 'Dauer', flags: 'Hinweise',
    sub: 'Subagent', ask: 'Freigabe', timeout: 'Abbruch', err: 'Fehler',
    permH: 'Freigabeweg', permNote: 'Median und p90 der Tool-Dauer je Freigabeweg. Ein langsamer Weg kostet bei jedem Call.',
    findH: 'Befunde', evidence: 'Beleg', impact: 'Wirkung', cost: 'Kosten',
    propH: 'Vorschläge', change: 'Änderung', where: 'Ort', fixes: 'Behebt', effort: 'Aufwand', gain: 'Gewinn', risk: 'Risiko',
    sev: { high: '▲ hoch', medium: '● mittel', low: '○ niedrig' },
    scope: { project: 'Projekt', user: 'Benutzer-Einstellungen', machine: 'Rechner', workflow: 'Skills / Workflow' },
    replyH: 'So geht es weiter', replyText: 'Bis jetzt ist nichts geändert. Antworte im Chat, welche Vorschläge umgesetzt werden sollen, z. B.',
    replyEx: 'V1, V3 – V2 nur für dieses Projekt', susH: 'Vermutungen (nicht belegt)', notH: 'Nicht geprüft', methodH: 'Wie gemessen',
    method: 'Dauer eines Calls = Ende der Modellantwort bis zum Tool-Ergebnis im Transkript. Freigabe-Abfragen enthalten deine Reaktionszeit. Rückfragen an dich und Subagents zählen nicht als Tool-Zeit. Die aktuelle Sitzung ist ausgenommen.',
  } : {
    eyebrow: 'Tool speed', sessions: 'sessions', calls: 'tool calls', period: 'period', made: 'generated',
    tileTools: 'Machine time in tools', tileErrors: 'Failed calls', tilePrompts: 'Permission prompts', tileSleep: 'Sleeping / polling',
    splitH: 'Where the time goes', splitNote: 'Per session, main conversation. Lengths to scale with the longest session.',
    tools: 'Tools', approval: 'Waiting for approval', human: 'Waiting for your answer', model: 'Model thinking and writing', subagents: 'Subagents',
    table: 'As a table', groupsH: 'Slowest command groups', groupsNote: 'Sum of wall time per command, main conversation and subagents.',
    median: 'median', errors: 'errors', slowH: 'Slowest single calls', when: 'Session', what: 'Call', time: 'Time', flags: 'Notes',
    sub: 'subagent', ask: 'prompt', timeout: 'aborted', err: 'error',
    permH: 'Permission path', permNote: 'Median and p90 tool time per permission path. A slow path costs on every call.',
    findH: 'Findings', evidence: 'Evidence', impact: 'Impact', cost: 'Cost',
    propH: 'Proposals', change: 'Change', where: 'Where', fixes: 'Fixes', effort: 'Effort', gain: 'Gain', risk: 'Risk',
    sev: { high: '▲ high', medium: '● medium', low: '○ low' },
    scope: { project: 'Project', user: 'User settings', machine: 'Machine', workflow: 'Skills / workflow' },
    replyH: 'What happens next', replyText: 'Nothing has been changed yet. Reply in the chat with the proposals to apply, e.g.',
    replyEx: 'V1, V3 – V2 for this project only', susH: 'Suspicions (not evidenced)', notH: 'Not checked', methodH: 'How it was measured',
    method: 'A call lasts from the end of the model reply to the tool result in the transcript. Permission prompts include your reaction time. Questions to you and subagents do not count as tool time. The current session is excluded.',
  };

  const app = document.getElementById('app');
  const el = (tag, attrs, ...kids) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null) continue;
      if (k === 'class') e.className = v; else if (k === 'style') e.setAttribute('style', v); else e.setAttribute(k, v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return e;
  };
  const ms = v => {
    if (!v) return '0s';
    if (v < 1000) return Math.round(v) + 'ms';
    const s = v / 1000;
    if (s < 60) return s.toFixed(1).replace('.', de ? ',' : '.') + 's';
    const m = Math.floor(s / 60);
    if (m < 60) return m + 'm ' + String(Math.round(s % 60)).padStart(2, '0') + 's';
    return Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm';
  };
  const day = t => t ? new Date(t).toLocaleDateString(de ? 'de-DE' : 'en-GB', { day: '2-digit', month: 'short' }) : '';
  const tip = el('div', { class: 'tip', role: 'tooltip' });
  tip.hidden = true;
  document.body.append(tip);
  const withTip = (node, text) => { node.dataset.tip = text; node.tabIndex = 0; node.setAttribute('aria-label', text); return node; };
  const showTip = (t, x, y) => {
    tip.textContent = t.dataset.tip; tip.hidden = false;
    tip.style.left = Math.max(8, Math.min(x, innerWidth - tip.offsetWidth - 8)) + 'px';
    tip.style.top = Math.min(y, innerHeight - tip.offsetHeight - 8) + 'px';
  };
  document.addEventListener('pointermove', e => {
    const t = e.target.closest && e.target.closest('[data-tip]');
    if (!t) { tip.hidden = true; return; }
    showTip(t, e.clientX + 14, e.clientY + 16);
  });
  document.addEventListener('focusin', e => {
    const t = e.target.closest && e.target.closest('[data-tip]');
    if (!t) { tip.hidden = true; return; }
    const r = t.getBoundingClientRect();
    showTip(t, r.left, r.bottom + 6);
  });
  document.addEventListener('focusout', () => { tip.hidden = true; });

  // ── head ──
  const t = data.totals || {};
  const starts = (data.sessions || []).map(s => s.start).filter(Boolean).sort((a, b) => a - b);
  const sum = k => (data.sessions || []).reduce((a, s) => a + (s[k] || 0), 0);
  app.append(el('header', { class: 'hero' },
    el('div', { class: 'eyebrow' }, L.eyebrow + ' · ' + data.project),
    el('h1', null, F.headline || (L.splitH + ' — ' + data.project)),
    F.summary ? el('p', { class: 'lead' }, F.summary) : null,
    el('div', { class: 'facts' },
      el('span', null, el('b', null, String((data.sessions || []).length)), ' ' + L.sessions),
      el('span', null, el('b', null, String(t.calls || 0)), ' ' + L.calls),
      starts.length ? el('span', null, L.period + ' ', el('b', null, day(starts[0]) + ' – ' + day(starts[starts.length - 1]))) : null,
      el('span', null, L.made + ' ', el('b', null, day(Date.parse(data.generatedAt))))),
    el('div', { class: 'tiles' },
      [[ms(sum('toolMs')), L.tileTools], [String(t.errors || 0), L.tileErrors], [String(t.prompts || 0), L.tilePrompts], [ms(t.sleepMs || 0), L.tileSleep]]
        .map(([v, l]) => el('div', { class: 'tile' }, el('span', { class: 'tile-value' }, v), el('span', { class: 'tile-label' }, l))))));

  // ── where the time goes ──
  const parts = [['toolMs', L.tools, 'var(--s1)'], ['approvalMs', L.approval, 'var(--s2)'], ['humanMs', L.human, 'var(--s3)'], ['modelMs', L.model, 'var(--s4)'], ['subagentMs', L.subagents, 'var(--s5)']];
  const sessions = [...(data.sessions || [])].sort((a, b) => (a.start || 0) - (b.start || 0));
  const maxTotal = Math.max(1, ...sessions.map(s => parts.reduce((a, [k]) => a + (s[k] || 0), 0)));
  const split = el('div', { class: 'panel' },
    el('div', { class: 'legend' }, parts.map(([, l, c]) => el('span', null, el('i', { style: 'background:' + c }), l))),
    sessions.map(s => {
      const total = parts.reduce((a, [k]) => a + (s[k] || 0), 0);
      const track = el('div', { class: 'stack-track', style: 'width:' + Math.max(2, total / maxTotal * 100) + '%' },
        parts.filter(([k]) => s[k] > 0).map(([k, l, c]) => withTip(el('div', { class: 'stack-seg', style: 'flex:' + s[k] + ' 1 0;background:' + c }), l + ': ' + ms(s[k]) + ' (' + Math.round(s[k] / total * 100) + '%)')));
      return el('div', { class: 'stack-row' }, el('span', { class: 'stack-label' }, day(s.start) + ' · ' + s.id.slice(0, 8)), el('div', null, track));
    }),
    el('details', null, el('summary', null, L.table),
      el('div', { class: 'table-wrap' }, el('table', null,
        el('thead', null, el('tr', null, el('th', null, L.when), parts.map(([, l]) => el('th', null, l)))),
        el('tbody', null, sessions.map(s => el('tr', null, el('td', { class: 'mono' }, s.id.slice(0, 8)), parts.map(([k]) => el('td', { class: 'num' }, ms(s[k]))))))))));
  app.append(el('section', null, el('h2', null, L.splitH), el('p', { class: 'note' }, L.splitNote), split));

  // ── slowest groups ──
  const groups = (data.groups || []).slice(0, 12);
  if (groups.length) {
    const max = Math.max(1, ...groups.map(g => g.totalMs));
    const rows = groups.map(g => el('div', { class: 'hbar-row' },
      el('div', { class: 'hbar-label' }, g.key, g.errors ? el('span', { class: 'chip err' }, '✕ ' + g.errors + ' ' + L.errors) : null),
      el('div', { class: 'hbar-track' }, withTip(el('div', { class: 'hbar-fill', style: 'width:' + Math.max(0.6, g.totalMs / max * 100) + '%;background:var(--s1)' }),
        g.key + '\n' + ms(g.totalMs) + ' · ' + g.n + '× · ' + L.median + ' ' + ms(g.medianMs) + ' · p90 ' + ms(g.p90Ms) + ' · max ' + ms(g.maxMs) + (g.example ? '\n' + g.example : ''))),
      el('div', { class: 'hbar-val' }, ms(g.totalMs) + ' · ' + g.n + '× · ' + L.median + ' ' + ms(g.medianMs))));
    app.append(el('section', null, el('h2', null, L.groupsH), el('p', { class: 'note' }, L.groupsNote), el('div', { class: 'panel' }, el('div', { class: 'hbars' }, rows))));
  }

  // ── permission path ──
  const perm = (data.byPermission || []).filter(p => p.n >= 3);
  if (perm.length > 1) {
    const max = Math.max(1, ...perm.map(p => p.p90Ms));
    app.append(el('section', null, el('h2', null, L.permH), el('p', { class: 'note' }, L.permNote),
      el('div', { class: 'panel' }, el('div', { class: 'hbars' }, perm.map(p => el('div', { class: 'hbar-row' },
        el('div', { class: 'hbar-label' }, p.permission),
        el('div', { class: 'hbar-track' }, withTip(el('div', { class: 'hbar-fill', style: 'width:' + Math.max(0.6, p.medianMs / max * 100) + '%;background:var(--s1)' }), p.permission + ': ' + p.n + '× · ' + L.median + ' ' + ms(p.medianMs) + ' · p90 ' + ms(p.p90Ms))),
        el('div', { class: 'hbar-val' }, L.median + ' ' + ms(p.medianMs) + ' · p90 ' + ms(p.p90Ms) + ' · ' + p.n + '×')))))));
  }

  // ── slowest calls ──
  const slow = (data.slowest || []).slice(0, 12);
  if (slow.length) {
    app.append(el('section', null, el('h2', null, L.slowH), el('div', { class: 'panel' }, el('div', { class: 'table-wrap' }, el('table', null,
      el('thead', null, el('tr', null, el('th', null, L.time), el('th', null, L.what), el('th', null, L.flags), el('th', null, L.when))),
      el('tbody', null, slow.map(c => el('tr', null,
        el('td', { class: 'num' }, ms(c.wallMs)),
        el('td', { class: 'cmd' }, c.what),
        el('td', null, [c.scope === 'subagent' ? el('span', { class: 'chip low' }, L.sub) : null, c.error ? el('span', { class: 'chip err' }, '✕ ' + L.err) : null, c.prompted ? el('span', { class: 'chip medium' }, L.ask) : null, c.timedOut ? el('span', { class: 'chip high' }, L.timeout) : null]),
        el('td', { class: 'mono' }, c.session)))))))));
  }

  // ── findings ──
  if ((F.findings || []).length) {
    app.append(el('section', null, el('h2', null, L.findH), el('div', { class: 'cards' }, F.findings.map(f => el('article', { class: 'card' },
      el('div', { class: 'card-head' }, el('span', { class: 'card-id' }, f.id), el('h3', null, f.title), el('span', { class: 'chip ' + (L.sev[f.severity] ? f.severity : 'low') }, L.sev[f.severity] || f.severity || '')),
      el('dl', null,
        f.evidence ? [el('dt', null, L.evidence), el('dd', null, f.evidence)] : null,
        f.impact ? [el('dt', null, L.impact), el('dd', null, f.impact)] : null,
        f.cost ? [el('dt', null, L.cost), el('dd', null, f.cost)] : null))))));
  }

  // ── proposals ──
  if ((F.proposals || []).length) {
    app.append(el('section', null, el('h2', null, L.propH), el('div', { class: 'cards' }, F.proposals.map(p => el('article', { class: 'card' },
      el('div', { class: 'card-head' }, el('span', { class: 'card-id' }, p.id), el('h3', null, p.title),
        p.scope ? el('span', { class: 'chip plain' }, L.scope[p.scope] || p.scope) : null,
        p.effort ? el('span', { class: 'chip low' }, L.effort + ' ' + p.effort) : null),
      el('dl', null,

  }

  // ── not checked, method ──
  app.append(el('section', null,
